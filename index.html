function weather(){if(curA===0){cx.strokeStyle='#bcd4ff55';cx.lineWidth=1.2;cx.beginPath();for(let i=0;i<70;i++){const x=(i*61+T*140)%(W+60)-30,y=(i*97+T*620)%H;cx.moveTo(x,y);cx.lineTo(x-6,y+16)}cx.stroke();const ph=T%11;if(ph<.14){cx.fillStyle='#fff';cx.globalAlpha=.45*(1-ph/.14);cx.fillRect(0,0,W,H);cx.globalAlpha=1}}
 else if(curA===1){cx.fillStyle='#d9a45a22';cx.fillRect(0,0,W,H);cx.fillStyle='#e8c88a99';for(let i=0;i<60;i++){const x=(i*83+T*300*(1+i%3*.4))%(W+40)-20,y=(i*47)%H+Math.sin(T*2+i)*6;cx.fillRect(x,y,3+i%3,1.5)}}}
function render(){cx.save();cx.clearRect(0,0,W,H);
 if(shake>.3)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 const SCN=state==='intro'||state==='home'||state==='menu'||state==='set'||state==='ach'||state==='camp'||state==='story'||state==='tour'||state==='daily',fs=state==='pick'?PV:(P?[P,E]:(SCN&&SC?SC:[]));
 cx.save();const z=cam.z,vx=Math.max(0,Math.min(W-W/z,cam.m-W/(2*z)));cx.translate(-vx*z,H*(1-z));cx.scale(z,z);bg();
 for(const it of items){const y=G-26+Math.sin(T*3+it.x)*4;if(it.l<3&&Math.sin(T*20)>0)continue;cx.fillStyle=it.t.c+'44';cx.beginPath();cx.arc(it.x,y,15,0,7);cx.fill();cx.strokeStyle=it.t.c;cx.lineWidth=2;cx.stroke();cx.font='16px sans-serif';cx.textAlign='center';cx.fillStyle='#fff';cx.fillText(it.t.e,it.x,y+6)}
 if(fs.length){cx.fillStyle='#00000040';for(const f of fs){const s=1-(G-f.y)/260;cx.beginPath();cx.ellipse(f.x,G+4,22*(f.sc||1)*Math.max(.4,s),4,0,0,7);cx.fill()}
  for(const f of[...fs].reverse())man(f);
  for(const f of fs)if(f.trail.length>1){cx.strokeStyle=f.sw;cx.lineCap='round';for(let i=1;i<f.trail.length;i++){cx.globalAlpha=i/f.trail.length*.6;cx.lineWidth=2+i*1.4;cx.beginPath();cx.moveTo(f.trail[i-1][0],f.trail[i-1][1]);cx.lineTo(f.trail[i][0],f.trail[i][1]);cx.stroke()}cx.globalAlpha=1}}
 if(P&&state!=='pick'){
  for(const p of proj)drawProj(p);
  for(const f of fs)if(f.ult&&f.ulk==='laser'&&f.ult>.2&&f.ult<.95){const x0=f.x+f.face*24,x1=f.face>0?W:0,hh=10+Math.sin(T*40)*3;cx.fillStyle='#7cff6b77';cx.fillRect(Math.min(x0,x1),f.y-44-hh,Math.abs(x1-x0),hh*2+8);cx.fillStyle='#fff';cx.fillRect(Math.min(x0,x1),f.y-42,Math.abs(x1-x0),5)}
  for(const s of sparks){cx.fillStyle=s.c;cx.globalAlpha=Math.max(0,s.l*2.5);cx.fillRect(s.x,s.y,4,4)}cx.globalAlpha=1;
  cx.textAlign='center';for(const f of[P,E]){if(f.dead)continue;let t='';if(f.pw.spd>0)t+='💨';if(f.pw.dmg>0)t+='💥';if(f.pw.shd>0)t+='🛡️';const sc=f.sc||1;
   if(t){cx.font='14px sans-serif';cx.fillStyle='#fff';cx.fillText(t,f.x,f.y-96*sc)}
   if(f.tel>0){cx.font='900 30px sans-serif';cx.fillStyle='#ff3b3b';cx.fillText('⚠',f.x,f.y-128*sc)}
   if(f.cmb>=2){cx.font='900 '+(15+Math.min(f.cmb,6)*2)+'px sans-serif';cx.fillStyle='#ffb347';cx.fillText('🔥×'+f.cmb,f.x,f.y-112*sc)}}}
 cx.restore();
 if(P||SCN||state==='pick')weather();
 if(SCN&&!P){for(const s of sparks){cx.fillStyle=s.c;cx.globalAlpha=Math.max(0,s.l*2.5);cx.fillRect(s.x,s.y,4,4)}cx.globalAlpha=1;if(state==='intro')drawIntro()}
 if(P&&state!=='pick'){
  hpbar(52,0,P);hpbar(W-352,1,E);enbar(52,0,P);enbar(W-352,1,E);
  cx.fillStyle='#e8eefc';cx.font='900 16px Cairo,sans-serif';cx.textAlign='center';
  cx.fillText(train?'تدريب 🎯':surv?'بقاء ♾️':camp?'مرحلة '+(cstage+1):daily?'تحدي اليوم':tour?RN[TR.rd]:mode===1?'المستوى '+lvl:'⚔',W/2,64);
  if(surv)cx.fillText('☠ '+kills,W/2,82);else if(need>1&&need<99)cx.fillText('جولة '+rIdx,W/2,82);
  if(CZ){cx.font='16px sans-serif';cx.fillText(['','🌙','🗡️','☝️','⚡'][CZ],W/2,100)}
  cx.font='700 13px Cairo,sans-serif';cx.textAlign='left';cx.fillText(P.ch.n+' · '+P.w.n,52,56);cx.fillText('🏆 '+w1,52,72);
  cx.textAlign='right';cx.fillText((E.boss?'👹 ':'')+E.w.n+' · '+E.ch.n,W-52,56);cx.fillText('🏆 '+w2,W-52,72);
  if(need>1&&need<99&&!surv)for(let i=0;i<need;i++){cx.fillStyle=i<r1?P.col:'#ffffff30';cx.beginPath();cx.arc(60+i*16,88,5,0,7);cx.fill();cx.fillStyle=i<r2?E.col:'#ffffff30';cx.beginPath();cx.arc(W-60-i*16,88,5,0,7);cx.fill()}
  if((P.dead||E.dead)&&state==='play'&&endT>.1){cx.globalAlpha=Math.min(1,endT*3);cx.fillStyle='#fff';cx.font='900 56px Cairo,sans-serif';cx.textAlign='center';cx.fillText('KO!',W/2,150);cx.globalAlpha=1}
  if(intro>0&&state==='play'){cx.globalAlpha=Math.min(1,intro*2);cx.fillStyle='#ff4d4d';cx.font='900 44px Cairo,sans-serif';cx.textAlign='center';cx.fillText('⚠ زعيم!',W/2,150);cx.globalAlpha=1}
  if(state==='rnd'){cx.fillStyle='#00000077';cx.fillRect(0,130,W,90);cx.fillStyle='#fff';cx.font='900 30px Cairo,sans-serif';cx.textAlign='center';cx.fillText(surv?'خصم جديد! 👊':E.dead?(mode===1?'كسبت الجولة! 🏆':'اللاعب 1 كسب الجولة'):(mode===1?'الكمبيوتر كسب الجولة':'اللاعب 2 كسب الجولة'),W/2,178);cx.font='700 16px Cairo,sans-serif';cx.fillText(surv?'استعد...':'جولة '+rIdx+' بتبدأ...',W/2,204)}
  if(toastT>0){cx.fillStyle='#000000bb';cx.fillRect(W/2-190,112,380,30);cx.fillStyle='#ffd24a';cx.font='700 15px Cairo,sans-serif';cx.textAlign='center';cx.fillText(toast,W/2,133)}
  if(state==='replay'){cx.fillStyle='#000';cx.fillRect(0,0,W,24);cx.fillRect(0,H-26,W,26);cx.fillStyle='#fff';cx.font='900 15px Cairo,sans-serif';cx.textAlign='center';cx.fillText('🎬 إعادة الضربة القاضية — المس الشاشة للتخطي',W/2,H-8)}}
 cx.restore()}
let last=0;
function startReplay(){rpl={i:Math.max(0,rec.length-100),skip:0,P,E,pr:proj,sp:sparks,bc:document.body.className};state='replay';document.body.className='rp'}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;T+=dt;toastT=Math.max(0,toastT-dt);intro=Math.max(0,intro-dt);camUpdate(dt);
 if(state==='intro'){if(kd('enter',' ','escape'))toHome();else updIntro(dt)}
 else if(['home','menu','set','ach','camp','story','tour','daily'].includes(state))updScene(dt);
 if(state==='pick'){for(const f of PV){const ph=(T%2.4)/f.w.du;f.atk=ph<1?ph:0}}
 if(state==='replay'){rpl.i+=dt*30;const i=Math.floor(rpl.i);
  if(i>=rec.length||rpl.skip||kd('enter')){P=rpl.P;E=rpl.E;proj=rpl.pr;sparks=rpl.sp;document.body.className=rpl.bc;endRound()}
  else{const F=rec[i];P=F.P;E=F.E;proj=F.pr;sparks=F.sp}}
 else if(state==='play'||state==='rnd'){const rn=state==='rnd';
  if(freeze>0)freeze-=dt;
  else{const sd=dt*(slow>0?.3:1)*(CZ===4?1.35:1);let p1,p2;
   if(rn){p1=p2=IDLE}else{p1=inp1();if(mode===2)p2=inp2();else{think(sd);p2=ai.i;if(inLava(E))p2.jump=1}}
   if(train)P.en=100;if(!rn)M.t+=dt;
   step(P,E,p1,sd);step(E,P,p2,sd);ai.i.atk=0;ai.i.sp=0;ai.i.dg=0;
   hazards(sd);updProj(sd);if(!rn)updItems(sd);
   for(const s of sparks){s.x+=s.vx*sd;s.y+=s.vy*sd;s.vy+=900*sd;s.l-=sd;if(s.y>G){s.y=G;s.vy*=-.3}}sparks=sparks.filter(s=>s.l>0);
   if(!rn){rec.push({P:snap(P),E:snap(E),pr:proj.map(p=>({...p})),sp:sparks.slice(0,40).map(s=>({...s}))});if(rec.length>140)rec.shift()}
   if(rn){rt-=dt;if(rt<=0)mkRound()}
   else if(E.dead||P.dead){endT+=dt;if(endT>1.6){if(S.rp&&!train&&rec.length>20)startReplay();else endRound()}}}
  slow=Math.max(0,slow-dt);shake*=.9;$('s1').classList.toggle('rdy',P.en>=100);$('s2').classList.toggle('rdy',E.en>=100)}
 render();requestAnimationFrame(loop)}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();requestAnimationFrame(loop);
